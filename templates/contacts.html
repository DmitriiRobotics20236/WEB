{% extends "base.html" %}
{% block content %}
<div class="section-title">📞 Контакты</div>
<div class="row g-3">
  <div class="col-md-6">
    <div class="info-card">
      <h3 style="font-size:0.95rem; margin-bottom:16px;">Свяжитесь с нами</h3>
      <ul>
        <li>📞 Телефон: +7 (999) 123-45-67</li>
        <li>📧 Email: shop@officemarket.ru</li>
        <li>📍 Адрес: г. Москва, ул. Офисная, д. 1</li>
        <li>🕐 Пн–Пт: 9:00–18:00</li>
      </ul>
    </div>
  </div>
  <div class="col-md-6">
    <div class="info-card">
      <h3 style="font-size:0.95rem; margin-bottom:16px;">Напишите нам</h3>
      <form novalidate>
        <div class="mb-3">
          <label class="form-label" style="font-size:.85rem;">Ваше имя</label>
          <input type="text" class="form-control" placeholder="Иван Петров">
        </div>
        <div class="mb-3">
          <label class="form-label" style="font-size:.85rem;">Email</label>
          <input type="email" class="form-control" placeholder="ivan@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label" style="font-size:.85rem;">Сообщение</label>
          <textarea class="form-control" rows="3" placeholder="Ваш вопрос..."></textarea>
        </div>
        <button type="button" onclick="alert('Спасибо! Мы свяжемся с вами в ближайшее время.')" class="btn-cart" style="padding:11px 24px;">Отправить</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
